<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#1f7a3d"><title>PoolSense</title>
<link rel="manifest" href="manifest.json"><link rel="icon" href="assets/icons/icon.svg">
<link rel="stylesheet" href="css/style.css"></head>
<body><header><h1>PoolSense</h1><span>offline aiming &amp; physics sandbox</span></header>
<main><canvas id="c"></canvas>
<section class="row">
<label class="btn">Load photo<input id="file" type="file" accept="image/*" hidden></label>
<button id="sampleImg">Sample photo</button><button id="sampleLay">Sample layout</button>
<button id="add">Add ball</button><button id="clear">Clear</button></section>
<section class="row">
<label>Pocket <select id="pocket"></select></label>
<label>Shot <select id="rail"><option value="direct">Direct</option><option>top</option><option>bottom</option><option>left</option><option>right</option></select></label>
<label>Power <input id="pw" type="range" min="1" max="10" value="4"></label>
<button id="shoot" class="go">Shoot ▶</button></section>
<section class="row"><select id="scn"></select><button id="load">Load</button><button id="save">Save</button></section>
<pre id="info"></pre></main>
<script src="js/geometry.js"></script><script src="js/physics.js"></script><script src="js/analyzer.js"></script>
<script src="js/renderer.js"></script><script src="js/storage.js"></script><script src="js/app.js"></script>
</body></html>
